# Robottens TIDSPLAN (trin 3, Jacobs valg 26/9-2026):
#   højst 2 artikler om dagen, fri tirsdag, fredag og søndag (Jacob 29/10-2026; før tir+fre fra 27/9) — udgives
#   direkte på main. Udgivelsesdage: mandag, onsdag, torsdag og lørdag (robot/plan.mjs FRIDAGE).
#   Kørslerne sker mandag-lørdag (cron 1-6), fordi omskrivningen kører 6 dage om ugen (Jacob 30/10-2026);
#   plan.mjs --tjek siger, om dagen har ny artikel (koer) og/eller omskrivning (omskriv).
#   HUSK: cron-teksten står to steder (schedule og jobbets "if"), og de skal være ens, ellers kører jobbet aldrig.
# Tider er UTC: 07:17 og 15:17 = kl. 9:17 og 17:17 dansk sommertid (8:17 og 16:17 vintertid).
# Minuttallet er skævt med vilje: GitHub er mest bagud på hele og halve timer.
# robot/plan.mjs tjekker loft og fridage igen, fordi GitHub kan være timer
# forsinket, og fordi knappen kan trykkes i hånden.
# Tomgangsalarmen ligger i sit eget workflow (tomgang.yml, 28/9): lå den her, blev den
# sprunget over sammen med robotten, når GitHub sprang robottens kørsler over.
# ÉN ROBOT (Jacob 30/10-2026: "samlet i en, ingen tillæg"): den samme kørsel skriver dagens nye artikel OG
#   skriver ældre artikler om (robot/plan.mjs --omskriv: 2 om dagen (fra 31/10), højst 1 med visninger — dagens kvote tages i
#   første kørsel, den anden samler op efter afvisninger).
#   Samme opskrift (robot/artikel.mjs), samme hjerne, ét byg og én udgivelse.
name: Robot (tidsplan)

on:
  schedule:
    - cron: '17 7,15 * * 1-6'
  workflow_dispatch:
    inputs:
      opgave:
        description: 'Hvad skal robotten gøre? (loft og fridage gælder også her)'
        type: choice
        options: [artikel, omskriv]
        default: artikel

permissions:
  contents: write

# Aldrig to kørsler på én gang (så loftet ikke kan snydes).
concurrency:
  group: robot-tidsplan
  cancel-in-progress: false

jobs:
  artikel:
    if: github.event.schedule == '17 7,15 * * 1-6' || inputs.opgave == 'artikel' || inputs.opgave == 'omskriv'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      # Jacobs hjerne (30/10-2026): stemme og holdninger fra det PRIVATE repo jacob-hjerne, hentet med læsenøglen
      # HJERNE_NOEGLE (en "deploy key" med kun læseadgang) til mappen _hjerne (står i .gitignore). Samme opskrift som
      # techfeedwatch. continue-on-error: mangler nøglen, stopper robot/artikel.mjs selv med en tydelig fejl — og
      # skriver INGEN artikel (Jacob: hjernen skal altid bruges).
      - name: Hent hjernen (jacob-hjerne, privat, kun læsning)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: jacobolsenjso-cloud/jacob-hjerne
          ssh-key: ${{ secrets.HJERNE_NOEGLE }}
          path: _hjerne
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Må der udgives nu?
        id: plan
        run: node robot/plan.mjs --tjek
      - name: Skriv artiklen
        if: steps.plan.outputs.koer == 'ja' && inputs.opgave != 'omskriv'
        env:
          # Nøglerne kommer fra GitHub Secrets og skrives aldrig ud.
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node robot/plan.mjs --koer
      - uses: actions/upload-artifact@v6
        if: always() && steps.plan.outputs.koer == 'ja' && inputs.opgave != 'omskriv'
        with:
          name: robot-ud
          path: robot/ud/
          if-no-files-found: ignore
      # Omskrivning af ældre artikler (Jacob 30/10-2026): køen robot/data/omskriv-koe.json, 2 om dagen (fra 31/10) (højst 1 med
      # Google-visninger), 6 dage om ugen, stop ved robot/plan.mjs OMSKRIV_LOFT_KR i måneden. Kører også, hvis
      # artiklen ovenfor blev afvist.
      - name: Skriv ældre artikler om
        if: always() && steps.plan.outputs.omskriv == 'ja'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node robot/plan.mjs --omskriv
      - name: Byg sitet (en artikel, der ødelægger bygget, når aldrig main)
        id: bygget
        if: always() && (steps.plan.outputs.koer == 'ja' || steps.plan.outputs.omskriv == 'ja')
        run: npm run build > /dev/null
      - name: Udgiv på main
        if: always() && steps.bygget.outcome == 'success'
        run: |
          git config user.name "techmediaarch-robot"
          git config user.email "robot@techmediaarch.com"
          git add src/content public/images robot/data
          git diff --cached --quiet && { echo "Intet at udgive"; exit 0; }
          git commit -m "Robot article $(date -u +%F) (run ${{ github.run_number }})"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && exit 0; sleep 10; done
          exit 1
      - uses: actions/upload-artifact@v6
        if: always() && steps.plan.outputs.omskriv == 'ja'
        with:
          name: robot-omskriv-ud
          path: robot/ud/
          if-no-files-found: ignore
