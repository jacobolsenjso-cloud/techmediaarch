# Robottens TIDSPLAN (trin 3, Jacobs valg 26/9-2026):
#   højst 2 artikler om dagen, fri tirsdag, fredag og søndag (Jacob 29/10-2026; før tir+fre fra 27/9) — udgives
#   direkte på main. Udgivelsesdage: mandag, onsdag, torsdag og lørdag (robot/plan.mjs FRIDAGE).
#   Kørslerne sker mandag-lørdag (cron 1-6), fordi omskrivningen kører 6 dage om ugen (Jacob 30/10-2026);
#   plan.mjs --tjek siger, om dagen har ny artikel (koer) og/eller omskrivning (omskriv).
#   HUSK: cron-teksten står to steder (schedule og jobbets "if"), og de skal være ens, ellers kører jobbet aldrig.
# Tider er UTC: 09:17 og 17:17 = kl. 10:17 og 18:17 dansk vintertid (11:17 og 19:17 sommertid).
# RESERVE (Jacob 4/11-2026): robotten startes til tiden af tma-starter (Cloudflare, cloudflare/tma-starter) kl. 7:43 og
#   15:43 UTC. GitHubs egen tidsplan ligger 1½ time senere, så de to aldrig står i kø bag hinanden, og robot/plan.mjs
#   (halvdagsreglen) lader kun reserven skrive, hvis tma-starters kørsel ikke nåede det.
# Minuttallet er skævt med vilje: GitHub er mest bagud på hele og halve timer.
# robot/plan.mjs tjekker loft og fridage igen, fordi GitHub kan være timer
# forsinket, og fordi knappen kan trykkes i hånden.
# Tomgangsalarmen ligger i sit eget workflow (tomgang.yml, 28/9): lå den her, blev den
# sprunget over sammen med robotten, når GitHub sprang robottens kørsler over.
# ÉN ROBOT (Jacob 30/10-2026: "samlet i en, ingen tillæg"): den samme kørsel skriver dagens nye artikel OG
#   skriver ældre artikler om (robot/plan.mjs --omskriv: 2 om dagen (fra 31/10), højst 1 med visninger — dagens kvote tages i
#   første kørsel, den anden samler op efter afvisninger).
#   Samme opskrift (robot/artikel.mjs), samme hjerne, ét byg og én udgivelse.
name: Robot (tidsplan)

on:
  schedule:
    - cron: '17 9,17 * * 1-6'
  workflow_dispatch:
    inputs:
      opgave:
        description: 'Hvad skal robotten gøre? (loft og fridage gælder også her)'
        type: choice
        options: [artikel, omskriv]
        default: artikel

permissions:
  contents: write

# Aldrig to kørsler på én gang (så loftet ikke kan snydes).
concurrency:
  group: robot-tidsplan
  cancel-in-progress: false

jobs:
  artikel:
    if: github.event.schedule == '17 9,17 * * 1-6' || inputs.opgave == 'artikel' || inputs.opgave == 'omskriv'
    runs-on: ubuntu-24.04
    # 11/11-2026: 40 min var for lidt. #62 (4/11) og #81 (11/11) blev stoppet ved 45 min, #74 sluttede på præcis 40,
    # fordi én ny artikel (op til 22 min) + 2 omskrivninger (op til 21 min) + byg + breddetjek tilsammen er over 40.
    # #81 nåede at udgive, men blev stoppet, før Bing fik besked. Nu: hvert langt trin har sit eget loft (artikel 30,
    # omskriv 30, breddetjek 10, Bing 15), og hele kørslen får plads til dem alle (90). Hænger ét trin, rammer det
    # sit eget loft — de næste trin (byg, udgiv, Bing) når stadig at køre.
    timeout-minutes: 90
    steps:
      # ref: main (4/11-2026): uden den henter GitHub main, som den så ud, da kørslen blev BESTILT. #60 ventede i kø bag
      # #59 og startede derfor på en gammel main uden #59's data — loft og pris blev læst forkert, og udgivelsen fejlede.
      - uses: actions/checkout@v5
        with:
          ref: main
      # Jacobs hjerne (30/10-2026): stemme og holdninger fra det PRIVATE repo jacob-hjerne, hentet med læsenøglen
      # HJERNE_NOEGLE (en "deploy key" med kun læseadgang) til mappen _hjerne (står i .gitignore). Samme opskrift som
      # techfeedwatch. continue-on-error: mangler nøglen, stopper robot/artikel.mjs selv med en tydelig fejl — og
      # skriver INGEN artikel (Jacob: hjernen skal altid bruges).
      - name: Hent hjernen (jacob-hjerne, privat, kun læsning)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: jacobolsenjso-cloud/jacob-hjerne
          ssh-key: ${{ secrets.HJERNE_NOEGLE }}
          path: _hjerne
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Må der udgives nu?
        id: plan
        run: node robot/plan.mjs --tjek
      - name: Skriv artiklen
        if: steps.plan.outputs.koer == 'ja' && inputs.opgave != 'omskriv'
        timeout-minutes: 30
        env:
          # Nøglerne kommer fra GitHub Secrets og skrives aldrig ud.
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          # Søgetal til emnevalget (9/11-2026, robot/lib/dataforseo.mjs). Mangler de, vælges der som før.
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
        run: node robot/plan.mjs --koer
      - uses: actions/upload-artifact@v6
        if: always() && steps.plan.outputs.koer == 'ja' && inputs.opgave != 'omskriv'
        with:
          name: robot-ud
          path: robot/ud/
          if-no-files-found: ignore
      # Omskrivning af ældre artikler (Jacob 30/10-2026): køen robot/data/omskriv-koe.json, 2 om dagen (fra 31/10) (højst 1 med
      # Google-visninger), 6 dage om ugen, stop ved robot/plan.mjs OMSKRIV_LOFT_KR i måneden. Kører også, hvis
      # artiklen ovenfor blev afvist.
      - name: Skriv ældre artikler om
        if: always() && steps.plan.outputs.omskriv == 'ja'
        timeout-minutes: 30
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node robot/plan.mjs --omskriv
      - name: Byg sitet (en artikel, der ødelægger bygget, når aldrig main)
        id: bygget
        if: always() && (steps.plan.outputs.koer == 'ja' || steps.plan.outputs.omskriv == 'ja')
        run: npm run build > /dev/null
      # Breddetjek (Jacob 1/11-2026): alle artikler åbnes i GitHubs installerede Chrome i computer- og mobilbredde;
      # går noget ud over tekstspalten, eller kan en side rulles sidelæns, udgives der IKKE (fejlen står i loggen).
      # Baggrund: 1/11 stak billederne ud til højre i 139 af 197 artikler, uden at noget tjek opdagede det.
      - name: Tjek at intet er for bredt (computer + mobil)
        id: bredde
        if: always() && steps.bygget.outcome == 'success'
        timeout-minutes: 10
        run: npm run tjek:bredde
      - name: Udgiv på main
        id: udgiv
        if: always() && steps.bygget.outcome == 'success' && steps.bredde.outcome == 'success'
        run: |
          git config user.name "techmediaarch-robot"
          git config user.email "robot@techmediaarch.com"
          git add src/content public/images robot/data
          git diff --cached --quiet && { echo "Intet at udgive"; exit 0; }
          git commit -m "Robot article $(date -u +%F) (run ${{ github.run_number }})"
          # Konflikt (4/11-2026, #60): ændrede main robot/data under kørslen, vinder kørslens udgave (den startede fra
          # nyeste main og har alt fra før). Konflikt i ALT andet (artikler, kode) stopper udgivelsen — intet skubbes.
          # Afprøvet i en prøve-repo 4/11: datakonflikt → udgivet; konflikt i anden fil → stop uden push.
          for i in 1 2 3; do
            if git pull --rebase -q origin main; then
              git push -q origin main && { echo "udgivet=ja" >> "$GITHUB_OUTPUT"; exit 0; }
            else
              konflikt=$(git diff --name-only --diff-filter=U)
              if [ -z "$konflikt" ]; then git rebase --abort 2>/dev/null || true; sleep 10; continue; fi
              if echo "$konflikt" | grep -qv '^robot/data/'; then
                echo "::error::Konflikt uden for robot/data: $konflikt"; git rebase --abort; exit 1
              fi
              echo "::warning::main ændrede robot/data under kørslen; kørslens udgave bruges: $konflikt"
              echo "$konflikt" | xargs git checkout --theirs --
              for f in $konflikt; do node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f" || { git rebase --abort; exit 1; }; done
              echo "$konflikt" | xargs git add --
              GIT_EDITOR=true git rebase --continue > /dev/null && git push -q origin main && { echo "udgivet=ja" >> "$GITHUB_OUTPUT"; exit 0; }
            fi
            sleep 10
          done
          exit 1
      # IndexNow (Jacob 31/10-2026): de artikler, robottens commit ændrede, meldes til Bing, når Cloudflare viser dem
      # (robot/indexnow.mjs venter højst 12 min). Fejler det, går robotten ikke i stå.
      - name: Meld nye og omskrevne artikler til Bing (IndexNow)
        if: always() && steps.udgiv.outputs.udgivet == 'ja'
        continue-on-error: true
        timeout-minutes: 15
        # -z/xargs -0: flere af de gamle Blogger-adresser har mellemrum i filnavnet
        run: git diff -z --name-only HEAD~1 HEAD -- src/content/posts | xargs -0 -r node robot/indexnow.mjs
      - uses: actions/upload-artifact@v6
        if: always() && steps.plan.outputs.omskriv == 'ja'
        with:
          name: robot-omskriv-ud
          path: robot/ud/
          if-no-files-found: ignore
