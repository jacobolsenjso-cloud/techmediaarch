# PRØVE af robottens nye kvalitetsregler (4/11-2026) — findes KUN på grenen robot-kvalitet og slettes, før grenen
# lægges på main. Kører ved push til grenen, skriver én artikel om (samme kode som tidsplanen) og gemmer resultatet
# som en fil til eftersyn (artifact). Den udgiver intet, bygger intet og pusher intet — kun læseadgang til repoet.
name: Robot (prøve på gren)

on:
  push:
    branches: [robot-kvalitet]
    paths: ['robot/**', '.github/workflows/robot-proeve.yml']

permissions:
  contents: read

concurrency:
  group: robot-proeve
  cancel-in-progress: true

jobs:
  proeve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Hent hjernen (jacob-hjerne, privat, kun læsning)
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: jacobolsenjso-cloud/jacob-hjerne
          ssh-key: ${{ secrets.HJERNE_NOEGLE }}
          path: _hjerne
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Skriv "How Does Generative AI Learn?" om med de nye regler (prøve)
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
        run: node robot/artikel.mjs --omskriv /2026/11/how-does-generative-ai-learn --maade fuld
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: robot-proeve
          path: |
            robot/ud/
            src/content/posts/2026/11/how-does-generative-ai-learn.md
          if-no-files-found: ignore
