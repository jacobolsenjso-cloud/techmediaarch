# Robottens MANUELLE knap (GitHub → Actions → "Robot (manuel)" → Run workflow).
# Én fil til alle håndstartede opgaver, så Jacob ikke skal flytte en ny
# workflow-fil ind for hver ny opgave (Claude må ikke skrive i .github/workflows).
#   soegeord      - læseliste med søgeordspakker (trin 1). Udgiver intet.
#   noegletjek    - tjekker at nøglerne virker. Skriver aldrig nøglerne ud.
#   proeveartikel - skriver ÉN prøveartikel på en egen gren (udkast-...), ikke
#                   på main, så intet udgives, før Jacob har godkendt (trin 2).
#   faq-ekstra    - (29/9-2026) skriver de manglende FAQ-spørgsmål (mindst 5 pr. artikel) som
#                   frontmatter "faq:" på en egen gren (faq-ekstra-...), ikke på main. Claude
#                   tjekker grenen og fletter den ind. Kan køres igen: færdige artikler springes over.
# Versioner låst som på techfeedwatch (26/9-2026): Node 24-udgaverne af
# handlingerne (målt i hver actions action.yml) og Ubuntu 24.04, så GitHubs
# skift til Ubuntu 26 den 19/10 ikke ændrer noget uden varsel.
name: Robot (manuel)

on:
  workflow_dispatch:
    inputs:
      opgave:
        description: 'Hvad skal robotten gøre?'
        type: choice
        options: [soegeord, noegletjek, proeveartikel, faq-ekstra]
        default: soegeord
      emne:
        description: 'Emne (fx AI) - tomt = alle / robotten vælger'
        required: false
        default: ''
      pakker:
        description: 'soegeord: pakker pr. emne'
        required: false
        default: '3'
      hovedsoegeord:
        description: 'proeveartikel: hovedsøgeord fra listen (tomt = robotten vælger)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  robot:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Kør opgaven
        env:
          # Nøglerne kommer fra GitHub Secrets og skrives aldrig ud.
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          CLOUDFLARE_AI_TOKEN: ${{ secrets.CLOUDFLARE_AI_TOKEN }}
          # Input sendes som miljøvariabler, ikke direkte ind i kommandoen.
          OPGAVE: ${{ inputs.opgave }}
          EMNE: ${{ inputs.emne }}
          PAKKER: ${{ inputs.pakker }}
          HOVED: ${{ inputs.hovedsoegeord }}
        run: |
          case "$OPGAVE" in
            soegeord)
              if [ -n "$EMNE" ]; then node robot/soegeord.mjs --pakker "$PAKKER" --emne "$EMNE" > /dev/null
              else node robot/soegeord.mjs --pakker "$PAKKER" > /dev/null; fi ;;
            noegletjek)
              node robot/noegletjek.mjs > /dev/null ;;
            proeveartikel)
              node robot/artikel.mjs --emne "$EMNE" --hoved "$HOVED" ;;
            faq-ekstra)
              # 32 minutter, så der er tid til at gemme grenen inden jobbets loft på 40
              node robot/faq-ekstra.mjs --minutter 32 ;;
            *) echo "Ukendt opgave"; exit 1 ;;
          esac
      - name: Gem prøveartiklen på en egen gren (ikke main)
        if: inputs.opgave == 'proeveartikel'
        run: |
          git config user.name "techmediaarch-robot"
          git config user.email "robot@techmediaarch.com"
          git checkout -b "udkast-${{ github.run_number }}"
          git add src/content public robot/data
          git commit -m "Draft article from robot run ${{ github.run_number }}" || { echo "Intet at gemme"; exit 0; }
          git push origin "udkast-${{ github.run_number }}"
      - name: Gem FAQ-spørgsmålene på en egen gren (ikke main)
        if: inputs.opgave == 'faq-ekstra'
        run: |
          git config user.name "techmediaarch-robot"
          git config user.email "robot@techmediaarch.com"
          git checkout -b "faq-ekstra-${{ github.run_number }}"
          git add src/content/posts
          git commit -m "Extra FAQ questions from robot run ${{ github.run_number }}" || { echo "Intet at gemme"; exit 0; }
          git push origin "faq-ekstra-${{ github.run_number }}"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: robot-ud
          path: robot/ud/
          if-no-files-found: ignore
